spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  # The Liquibase baseline is generated from PostgreSQL (PG-flavoured types/indexes).
  # Tests build their schema with Hibernate create-drop against in-memory H2 instead.
  liquibase:
    enabled: false
workflow:
  knowledge:
    qdrant:
      url: ""
  mode: gui
