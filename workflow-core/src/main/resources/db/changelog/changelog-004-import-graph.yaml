# File-level import/dependency graph — one row per directed edge (fromPath imports toPath).
# Mirrors the ProjectIndexEdge entity. preConditions keep the changeSet safe where
# ddl-auto:update already created the table on an existing install.
databaseChangeLog:

  - changeSet:
      id: 004-project-index-edge
      author: graphify
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - tableExists:
                tableName: project_index_edge
      changes:
        - createTable:
            tableName: project_index_edge
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: project_slug
                  type: VARCHAR(255)
                  constraints: { nullable: false }
              - column:
                  name: from_path
                  type: VARCHAR(1024)
                  constraints: { nullable: false }
              - column:
                  name: to_path
                  type: VARCHAR(1024)
                  constraints: { nullable: false }
              - column:
                  name: import_type
                  type: VARCHAR(32)
                  constraints: { nullable: false }
              - column:
                  name: from_line
                  type: INTEGER
                  constraints: { nullable: false }
              - column:
                  name: indexed_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints: { nullable: false }
        - addUniqueConstraint:
            tableName: project_index_edge
            constraintName: uk_edge_unique
            columnNames: project_slug, from_path, to_path, from_line
        - createIndex:
            tableName: project_index_edge
            indexName: idx_edge_from
            columns:
              - column: { name: project_slug }
              - column: { name: from_path }
        - createIndex:
            tableName: project_index_edge
            indexName: idx_edge_to
            columns:
              - column: { name: project_slug }
              - column: { name: to_path }
