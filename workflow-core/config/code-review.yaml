name: code-review
description: |
  Read-only code review (stack-agnostic).

  Flow: git_branch OR mr → analysis (summarise changes, risks) →
  ai_review (security / perf / anti-patterns) → run_report.

  ZERO mutations. No agent_with_tools, no shell_exec, no commit step.
  This pipeline cannot edit files even if the LLM hallucinates an Edit
  call — the blocks here don't expose write tools.

  Entry points:
    - from_branch: review a local git branch (diff vs main).
    - from_mr: review a GitLab MR or GitHub PR by URL/id.

entry_points:
  - id: from_branch
    name: "Review a git branch"
    from_block: git_branch
    requires_input: branch_name
    inject:
      - { block_id: mr, source: empty }

  - id: from_mr
    name: "Review a GitLab MR or GitHub PR"
    from_block: mr
    requires_input: mr_url
    inject:
      - { block_id: git_branch, source: empty }

pipeline:
  - id: git_branch
    block: git_branch_input
    approval: false
    depends_on: []
    config:
      working_dir: ${input.working_dir}

  - id: mr
    block: mr_input
    approval: false
    depends_on: []

  # Review-mode analyst: summarise WHAT changes, WHERE the impact lands,
  # WHICH areas are risky. Does NOT generate an acceptance_checklist —
  # this is post-hoc review, not pre-implementation planning.
  - id: analysis
    block: analysis
    approval: false
    depends_on: [git_branch, mr]
    agent:
      tier: smart
      maxTokens: 8192
      temperature: 0.3
      systemPrompt: |
        You are a code-review analyst. Read the diff and summarise:
          - change_summary: 1-3 sentences on what changes
          - affected_components: modules / files / public APIs touched
          - risk_areas: places where bugs are most likely (concurrency,
            error handling, security boundaries, perf-critical paths)
        Do NOT generate an acceptance_checklist — this is a review of
        completed work, not a plan. Be specific and concrete.

  # AI review: security / performance / anti-patterns. No style nits.
  - id: ai_review
    block: ai_review
    approval: false
    depends_on: [analysis]
    agent:
      tier: smart
      maxTokens: 8192
      temperature: 0.3
      systemPrompt: |
        You review code for SUBSTANTIVE issues only. Focus on:
          - security: injection, broken access control, secret leaks,
            unsafe deserialisation, missing authn/authz checks
          - performance: N+1 queries, missing indexes, blocking ops on
            hot paths, unbounded allocations, leaks
          - anti-patterns: race conditions, missing error handling,
            swallowed exceptions, broken invariants
        Do NOT comment on style, naming, or formatting — that's a
        different review. Output:
          - verdict: one of approve / request_changes / comment
          - issues: list of {severity, file, line, message}
        severity ∈ {critical, important, nice_to_have}.

  # Non-blocking final aggregator.
  - id: report
    block: run_report
    phase: publish
    approval: false
    depends_on: [ai_review]
